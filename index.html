<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Eisenberg Points</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Points">
<meta name="theme-color" content="#EEEAFB">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEEAFB; --ink:#231C4F; --soft:#6A6391; --card:#fff; --line:#DDD6F3;
  --gold:#FFC93C; --plus:#1A8F5C; --minus:#D9482B;
  --emmie:#D93A77; --dawson:#1677C9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.4 Fredoka,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#app{max-width:620px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:28px;font-weight:600;margin:8px 0 4px;line-height:1.15}
h2{font-size:19px;font-weight:600;margin:26px 0 10px}
p{margin:0 0 12px}
.soft{color:var(--soft)}
.k-emmie{--kid:var(--emmie)} .k-dawson{--kid:var(--dawson)}

/* the ticket: the one loud thing on the page */
.ticket{display:flex;align-items:stretch;background:var(--kid);color:#fff;border-radius:18px;width:100%;text-align:left;
  -webkit-mask:radial-gradient(circle at 0 50%,transparent 11px,#000 11.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 11px,#000 11.5px) right/51% 100% no-repeat;
          mask:radial-gradient(circle at 0 50%,transparent 11px,#000 11.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 11px,#000 11.5px) right/51% 100% no-repeat}
.ticket .main{flex:1;padding:18px 18px 18px 30px;min-width:0}
.ticket .stub{display:flex;align-items:center;justify-content:center;padding:0 26px 0 16px;border-left:3px dashed rgba(255,255,255,.55);font-size:34px}
.ticket .who{font-weight:500;font-size:17px;opacity:.95}
.ticket .num{font-weight:700;font-size:76px;line-height:.95;letter-spacing:-1px;display:inline-block}
.ticket .unit{font-weight:500;font-size:19px;margin-left:6px}
.ticket .note{font-size:15px;margin-top:6px;opacity:.95}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .ticket .main{padding:12px 10px 12px 24px}
.pair .ticket .num{font-size:46px}
.pair .ticket .unit{font-size:15px}
.pair .ticket .stub{display:none}
.pair .ticket{opacity:.45;transition:opacity .15s}
.pair .ticket[aria-pressed=true]{opacity:1}
@keyframes bump{40%{transform:scale(1.18)}}
.bump{animation:bump .45s ease}
@media (prefers-reduced-motion:reduce){.bump{animation:none}.pair .ticket{transition:none}}

.tabs{display:flex;gap:6px;margin:20px 0 4px;background:#fff;border-radius:999px;padding:5px}
.tabs button{flex:1;padding:10px 4px;white-space:nowrap;border-radius:999px;font-weight:500;color:var(--soft)}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}

.list{background:var(--card);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;border-top:1.5px solid var(--bg)}
.row:first-child{border-top:0}
button.row:active{background:#F6F3FE}
.emo{font-size:26px;width:34px;text-align:center;flex:none}
.grow{flex:1;min-width:0}
.label{font-weight:500;overflow-wrap:anywhere}
.sub{font-size:14px;color:var(--soft)}
.pts{font-weight:700;font-size:19px;flex:none;white-space:nowrap}
.pts.plus{color:var(--plus)} .pts.minus{color:var(--minus)} .pts.zero{color:var(--soft)}
.empty{padding:22px 16px;color:var(--soft);text-align:center}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.small{min-height:38px;padding:6px 14px;font-size:15px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.link{color:var(--soft);text-decoration:underline;font-size:15px;padding:10px}
.bar{height:8px;border-radius:99px;background:var(--bg);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}

.ask{background:var(--gold);border-radius:18px;padding:14px;margin-top:12px}
.ask .acts{display:flex;gap:8px;margin-top:10px}
.ask .acts .btn{flex:1}
.banner{background:#fff;border-radius:14px;padding:10px 14px;font-size:14px;color:var(--soft);margin-bottom:12px}
.banner.err{background:#FDE4DD;color:#7A2412}
.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.who-grid button{background:#fff;border-radius:22px;padding:26px 10px;font-weight:600;font-size:21px}
.who-grid button span{display:block;font-size:44px;margin-bottom:4px}
.who-grid .k-emmie,.who-grid .k-dawson{background:var(--kid);color:#fff}
.foot{text-align:center;margin-top:28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.top h1{margin:0}
.foot.ver{font-size:15px;margin-top:22px}
.foot.ver .link{padding:10px 8px}

#sheet{position:fixed;inset:0;background:rgba(35,28,79,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
#sheet.open{display:flex}
#sheet form{background:#fff;width:100%;max-width:620px;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
#sheet h3{margin:0 0 14px;font-size:22px;font-weight:600}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:15px;color:var(--soft);margin-bottom:5px}
.field input{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:18px}
.field input:focus{border-color:var(--ink);outline:0}
.two{display:grid;grid-template-columns:84px 1fr;gap:10px}
.seg{display:flex;gap:6px;background:var(--bg);border-radius:999px;padding:5px;margin-bottom:14px}
.seg label{flex:1;text-align:center}
.seg input{position:absolute;opacity:0}
.seg span{display:block;padding:9px;border-radius:999px;font-weight:500;color:var(--soft)}
.seg input:checked+span{background:#fff;color:var(--ink)}
.seg input:focus-visible+span{outline:3px solid var(--ink)}
.pin{letter-spacing:.5em;text-align:center;font-size:30px!important;font-weight:600}
.acts2{display:flex;gap:8px;margin-top:6px}
.acts2 .btn{flex:1}
.msg{color:var(--minus);font-size:15px;min-height:22px;margin:-4px 0 8px}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 12px 10px 20px;display:none;align-items:center;gap:12px;width:max-content;max-width:calc(100% - 24px);z-index:9;font-weight:500;border-radius:24px}
#toast.open{display:flex}
#toast button{background:var(--gold);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:600;flex:none}
#toast.plain{padding-right:20px}
.ticket{position:relative}
.badge{display:inline-block;margin-top:6px;background:var(--gold);color:var(--ink);border-radius:99px;padding:1px 9px;font-size:13px;font-weight:600}
.tbar{height:8px;border-radius:99px;background:rgba(255,255,255,.3);margin-top:8px;overflow:hidden}
.tbar i{display:block;height:100%;background:#fff;border-radius:99px}
.bothbtn{width:100%;margin-top:10px;padding:10px;border-radius:999px;background:#fff;color:var(--soft);font-weight:500}
.bothbtn[aria-pressed=true]{background:var(--ink);color:#fff}
.star{font-size:27px;line-height:1;width:44px;height:44px;flex:none;color:var(--soft)}
.star[aria-pressed=true]{color:#E0A100}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:#fff;border-radius:16px;padding:12px 6px;text-align:center}
.stats b{display:block;font-size:28px;font-weight:700;line-height:1.1}
.stats span{font-size:14px;color:var(--soft)}
.stats .plus{color:var(--plus)} .stats .minus{color:var(--minus)}
.half{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#pop{position:fixed;inset:0;background:rgba(35,28,79,.62);display:none;align-items:center;justify-content:center;z-index:20;padding:20px;overflow:hidden}
#pop.open{display:flex}
#pop .card{background:#fff;border-radius:26px;padding:24px 18px 18px;width:100%;max-width:420px;text-align:center;position:relative;z-index:1;max-height:90vh;overflow:auto}
#pop .big{font-size:84px;font-weight:700;line-height:1}
#pop .big.plus{color:var(--plus)} #pop .big.minus{color:var(--minus)}
#pop h3{font-size:24px;font-weight:600;margin:6px 0 14px}
#pop .list{text-align:left;background:var(--bg);margin-bottom:12px}
#pop .row{border-top-color:#fff}
.conf{position:absolute;top:-24px;width:10px;height:16px;border-radius:3px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(600deg)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}}
#sheet form{position:relative}
#sheet h3{padding-right:44px}
.xbtn{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:var(--bg);color:var(--ink);font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2}
.xbtn:active{background:var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 10px}
.hrow h2{margin:0;min-width:0}
.hrow .btn{flex:none}
.asked{flex:none;font-weight:500}
.kidpick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.kidbtn{background:var(--kid);color:#fff;border-radius:22px;padding:24px 10px 20px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:22px}
.kidbtn .e{font-size:46px;line-height:1.1}
.kidbtn .badge{margin-top:6px}
.bothhead{margin-bottom:4px}

/* ---------- parent theme: calmer, tighter, grown-up ---------- */
body.adult{--bg:#F3F4F7;--ink:#1B2233;--soft:#69728A;--line:#E1E4EB;--plus:#167A50;--minus:#C2412A;
  font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
body.adult h1{font-size:26px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
body.adult h2{font-size:13.5px;font-weight:600;color:var(--soft);margin:24px 0 8px}
body.adult .hrow{margin:26px 0 8px}
body.adult .hrow h2{margin:0}
body.adult .banner{border-radius:10px;box-shadow:0 0 0 1px var(--line)}
body.adult .list{border-radius:12px;box-shadow:0 0 0 1px var(--line)}
body.adult .row{padding:12px 14px;gap:12px;border-top:1px solid var(--line)}
body.adult .row:first-child{border-top:0}
body.adult button.row:active{background:#F6F7FA}
body.adult .emo{display:none}
body.adult .label{font-weight:500}
body.adult .sub{font-size:13.5px}
body.adult .pts{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
body.adult .btn{border-radius:10px;font-weight:600;min-height:42px}
body.adult .btn.small{min-height:34px;font-size:14px;padding:6px 12px}
body.adult .btn.ghost{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
body.adult .tabs{background:#E6E8EE;border-radius:10px;padding:3px;margin:20px 0 4px;gap:2px}
body.adult .tabs button{border-radius:8px;padding:8px 4px;font-size:15px;color:var(--soft)}
body.adult .tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(27,34,51,.14)}
body.adult .ticket{-webkit-mask:none;mask:none;background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 0 0 1px var(--line),inset 3px 0 0 var(--kid)}
body.adult .ticket .stub{display:none}
body.adult .ticket .main{padding:16px 18px 16px 24px}
body.adult .ticket .who{font-size:14px;font-weight:500;color:var(--soft)}
body.adult .ticket .num{font-size:42px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
body.adult .ticket .unit{font-size:15px;color:var(--soft);font-weight:500}
body.adult .badge{background:#FFF1C7;color:#7A5600;font-weight:600}
body.adult .ask{background:#fff;border-radius:10px;box-shadow:0 0 0 1px var(--line),inset 3px 0 0 #D9A400;padding:14px 14px 14px 18px}
body.adult .ask .label{font-weight:600}
body.adult .ask > div:nth-child(2){color:var(--soft);font-size:15px}
body.adult h2.first{margin-top:18px}
body.adult .kidpick{grid-template-columns:1fr;gap:0;margin-top:0;background:#fff;border-radius:10px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
body.adult .kidbtn{background:#fff;color:var(--ink);border-radius:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;padding:13px 14px;font-size:16px;font-weight:500;box-shadow:none}
body.adult .kidbtn + .kidbtn{border-top:1px solid var(--line)}
body.adult .kidbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--kid);flex:none}
body.adult .kidbtn .cnt{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
body.adult .kidbtn .chev{color:var(--soft);font-size:20px;line-height:1}
body.adult .kidbtn .cnt + .chev{margin-left:0}
body.adult .kidbtn .n + .chev{margin-left:auto}
body.adult .k-both{--kid:#9AA1B2}
body.adult .hint{font-size:14px;margin:-4px 0 0}
body.adult .stats div{border-radius:12px;box-shadow:0 0 0 1px var(--line)}
body.adult .stats b{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}
body.adult #sheet{background:rgba(27,34,51,.45)}
body.adult #sheet form{border-radius:16px 16px 0 0}
body.adult #sheet h3{font-size:20px;font-weight:650}
body.adult .field input{border-radius:10px;border-width:1.5px;font-size:17px}
body.adult .seg{border-radius:10px;padding:3px;background:#E6E8EE}
body.adult .seg span{border-radius:8px;padding:8px}
body.adult .xbtn{background:#EEF0F4}
body.adult #toast{border-radius:12px}
body.adult #toast button{border-radius:8px}
body.adult .top{margin-bottom:14px}
.lead{margin:22px 0 -6px}
.whopick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.whopick .btn{min-height:56px;font-size:18px;background:var(--kid);color:#fff}
.whopick .both{grid-column:1/-1;background:var(--ink)}
.modeseg{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#E6E8EE;border-radius:8px;padding:2px;margin:12px 0 10px}
.modeseg button{padding:7px 4px;border-radius:6px;font-weight:500;color:var(--soft);font-size:14.5px}
.modeseg button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(27,34,51,.14)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:#fff;padding:11px 12px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:56px;overflow-wrap:anywhere}
.tile:active{background:#F6F7FA}
.tile .t-main{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tile .label{font-weight:500;font-size:14.5px;line-height:1.3}
.tile .pts{font-size:14.5px;font-weight:600;flex:none}
.tile .sub{font-size:12px;color:var(--soft);line-height:1.25}
.tile.custom .label,.tile.custom .pts{color:var(--soft)}
body.adult .whopick .btn{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-size:17px;font-weight:500;gap:8px;min-height:52px}
body.adult .whopick .btn .dot{width:8px;height:8px;border-radius:50%;background:var(--kid)}
body.adult .whopick .both{background:var(--ink);color:#fff;box-shadow:none}

/* parent: smaller type, square corners */
body.adult{font-size:15px}
body.adult h1{font-size:22px}
body.adult h2{font-size:12.5px}
body.adult .label{font-size:15px}
body.adult .pts{font-size:15px}
body.adult .soft,body.adult .hint{font-size:13.5px}
body.adult .kidbtn{font-size:15px;padding:12px 14px}
body.adult .tile{min-height:50px;padding:9px 11px}
body.adult .tile .label,body.adult .tile .pts{font-size:13.5px}
body.adult .tile .label{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
body.adult .tile .sub{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.adult .ask .label{font-size:15px}
body.adult .ask > div:nth-child(2){font-size:13.5px}
body.adult .btn{font-size:14.5px;min-height:38px}
body.adult .btn.small{font-size:13.5px;min-height:32px}
body.adult .tabs button,body.adult .modeseg button{font-size:13.5px;padding:7px 4px}
body.adult .ticket .num{font-size:36px}
body.adult .ticket .who,body.adult .ticket .unit{font-size:13.5px}
body.adult .stats b{font-size:21px}
body.adult .stats span{font-size:12.5px}
body.adult .foot.ver{font-size:13px}
body.adult .btn,body.adult .tabs,body.adult .tabs button,body.adult .modeseg,body.adult .modeseg button,
body.adult .seg,body.adult .seg span,body.adult .badge,body.adult .kidbtn .cnt,body.adult #toast,body.adult #toast button,
body.adult .xbtn,body.adult .kidpick,body.adult .tiles,body.adult .ticket,body.adult .ask,body.adult .list,
body.adult .stats div,body.adult .banner,body.adult .field input,body.adult .whopick .btn{border-radius:3px}
body.adult #sheet form{border-radius:6px 6px 0 0}
body.adult .tabs,body.adult .modeseg,body.adult .seg{padding:2px}
body.adult .xbtn{width:34px;height:34px;font-size:22px}
.gtime{background:var(--ink);color:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gtime b{font-size:30px;font-weight:700;line-height:1.1;color:var(--gold)}
.gtime.none b{font-size:22px;color:#fff}
.gtime span{opacity:.9}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}
body.adult .ticket .note{font-size:13.5px;color:var(--soft);opacity:1;margin-top:4px}
.stbl .row{gap:8px}
.stbl .c{width:66px;flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.stbl .c b{font-weight:600}
.stbl .head{font-size:12.5px;font-weight:600;color:var(--soft);padding-top:8px;padding-bottom:8px}
.stbl .total{background:#F6F7FA}
.stbl .total .c b{font-size:17px}
.race{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.race div{background:var(--kid);color:#fff;border-radius:16px;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;opacity:.8}
.race div.me{opacity:1;box-shadow:0 0 0 3px var(--gold)}
.race b{font-size:26px;font-weight:700}
.viewbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:#fff;border-radius:14px;padding:9px 10px 9px 14px;margin:-4px 0 14px;font-weight:500;font-size:15px;line-height:1.3;box-shadow:0 4px 14px rgba(35,28,79,.25)}
.viewbar .btn{background:var(--gold);color:var(--ink);flex:none}
.glog .dot{width:8px;height:8px;border-radius:50%;background:var(--kid);flex:none;align-self:center}
.cashcard{background:#fff;border-radius:18px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cashcard b{display:block;font-size:18px;font-weight:600}
.cashcard span{color:var(--soft);font-size:15px}
.cashcalc{font-weight:600;font-size:18px;margin:-4px 0 10px}
</style>
</head>
<body>
<div id="app"><p class="soft" style="padding:40px 0;text-align:center">Loading points…</p></div>
<div id="sheet"></div>
<div id="toast" role="status"></div>
<div id="pop"></div>

<script>
/* ============================================================
   SYNC SETTINGS
   Paste the Firebase web config between the braces to turn on

const INC = n => ({$inc:n}), DEL = {$del:true};

async function firebaseStore(cfg){
  const base = 'https://www.gstatic.com/firebasejs/10.12.0/';
  const [{initializeApp}, fs] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-firestore.js')]);
  const db = fs.getFirestore(initializeApp(cfg));
  const mainRef = fs.doc(db,'family','main');
  const logCol = kid => fs.collection(db,'family','main','log_'+kid);
  const conv = v => v && v.$inc!==undefined ? fs.increment(v.$inc) : v && v.$del ? fs.deleteField() : v;
  return {
    subMain(cb,err){ fs.onSnapshot(mainRef, s => cb(s.exists()? s.data() : null), err); },
    subLog(kid,cb,err){ fs.onSnapshot(fs.query(logCol(kid), fs.orderBy('ts','desc'), fs.limit(300)), s => cb(s.docs.map(d => ({id:d.id, ...d.data()}))), err); },
    subGames(kid,cb){ fs.onSnapshot(fs.query(fs.collection(db,'family','main','games_'+kid), fs.orderBy('ts','desc'), fs.limit(60)), s => cb(s.docs.map(d => ({id:d.id, ...d.data()}))), () => {}); },
    addGame(kid, entry){ return fs.addDoc(fs.collection(db,'family','main','games_'+kid), entry); },
    seed(obj){ return fs.setDoc(mainRef, obj, {merge:true}); },
    apply({set,addLog,delLog}){
      const b = fs.writeBatch(db);
      if(set){ const u={}; for(const k in set) u[k]=conv(set[k]); b.update(mainRef,u); }
      for(const a of [].concat(addLog||[])) b.set(fs.doc(logCol(a.kid), a.id), a.entry);
      for(const d of [].concat(delLog||[])) b.delete(fs.doc(logCol(d.kid), d.id));
      return b.commit();
    }
  };
}

function localStore(){
  const KEY='ep_local';
  let data; try{ data = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  data = data || {main:null, logs:{emmie:[],dawson:[]}};
  data.games = data.games || {emmie:[],dawson:[]};
  const subs = {main:[], emmie:[], dawson:[]};
  const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} };
  const copy = () => data.main ? JSON.parse(JSON.stringify(data.main)) : null;   // hand out copies, like the live database does
  const emit = () => { subs.main.forEach(f=>f(copy())); for(const k in KIDS) subs[k].forEach(f=>f([...data.logs[k]].sort((a,b)=>b.ts-a.ts).slice(0,300))); };
  return {
    subMain(cb){ subs.main.push(cb); cb(copy()); },
    subLog(kid,cb){ subs[kid].push(cb); cb([...data.logs[kid]].sort((a,b)=>b.ts-a.ts)); },
    subGames(kid,cb){ (subs['g_'+kid] = subs['g_'+kid] || []).push(cb); cb([...data.games[kid]].sort((a,b)=>b.ts-a.ts).slice(0,60)); },
    async addGame(kid, entry){ data.games[kid].push({id:uid(), ...entry}); save(); (subs['g_'+kid]||[]).forEach(f => f([...data.games[kid]].sort((a,b)=>b.ts-a.ts).slice(0,60))); },
    async seed(obj){ data.main = Object.assign(data.main||{}, obj); save(); emit(); },
    async apply({set,addLog,delLog}){
      if(set) for(const path in set){
        const keys = path.split('.'), last = keys.pop(); let o = data.main;
        for(const k of keys) o = o[k] = o[k] || {};
        const v = set[path];
        if(v && v.$inc!==undefined) o[last] = (o[last]||0) + v.$inc;
        else if(v && v.$del) delete o[last];
        else o[last] = v;
      }
      for(const a of [].concat(addLog||[])) data.logs[a.kid].push({id:a.id, ...a.entry});
      for(const d of [].concat(delLog||[])) data.logs[d.kid] = data.logs[d.kid].filter(e => e.id!==d.id);
      save(); emit();
    }
  };
}

async function checkUpdate(){
  toast('Checking for an update\u2026');
  try{
    const res = await fetch(location.pathname + '?t=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    const m = (await res.text()).match(/const VERSION = '([^']+)'/);
    if(!m) throw new Error('no version');
    if(m[1] === VERSION) return toast(`You have the latest version (${VERSION}).`);
    toast(`Updating to version ${m[1]}\u2026`);
    await fetch(location.href, {cache:'reload'}).catch(() => {});
    setTimeout(() => location.reload(), 700);
  }catch(e){ toast('Couldn\u2019t check for an update. Check the internet connection and try again.'); }
}

const logsLoaded = {}; let news = [];
function checkNews(kid){
  if(!logsLoaded[kid] || role()!==kid) return;
  const key = 'ep_seen_'+kid, rows = logs[kid], top = rows.reduce((m,e) => Math.max(m,e.ts), 0), seen = ls.get(key);
  if(seen===null){ ls.set(key, String(top)); return; }
  const fresh = rows.filter(e => e.ts > +seen);

  } else if(ui.ktab==='earn'){
    const bs = byPts(sorted(main && main.behaviors)), up = bs.filter(b=>b.pts>0), down = bs.filter(b=>b.pts<0);
    const asked = new Set(petitionsFor(kid).map(q => q.bid).filter(Boolean));
    const list = (arr, canAsk) => `<div class="list">${arr.map(b => { const sub = actNote(kid,b,true);
      return `<div class="row"><span class="emo">${esc(b.emoji)}</span><div class="grow"><div class="label">${esc(b.label)}</div>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div><span class="pts ${cls(b.pts)}">${signed(b.pts)}</span>
        ${canAsk ? (asked.has(b.id) ? '<span class="sub asked">Asked</span>' : `<button class="btn gold small" data-act="petition" data-id="${b.id}">I did this</button>`) : ''}</div>`; }).join('') || '<div class="empty">Nothing here yet.</div>'}</div>`;
    body = `<div class="hrow"><h2>Ways to earn points</h2><button class="btn ghost small" data-act="petition">+ Something else</button></div>
      <p class="soft">Did one of these? Tap I did this and Mom or Dad will check it.</p>${list(up,true)}<h2>Ways to lose points</h2>${list(down,false)}`;
  } else if(ui.ktab==='games'){
    const secs = gameSecs(kid);
    body = `<h2>Games</h2><div class="gtime${secs?'':' none'}"><b>${secs ? fmtGame(secs) : 'No game time'}</b><span>${secs ? 'of game time to play' : 'Earn some from the Earn list. Look for the 🎮.'}</span></div>
      <div class="list">${GAMES.map(g => `<div class="row"><span class="emo">${g.emoji}</span><div class="grow"><div class="label">${g.name}</div><div class="sub">${g.blurb}</div><div class="sub">${monthBest(monthKey(),g.id,kid) ? `Your best this month: ${monthBest(monthKey(),g.id,kid).toLocaleString()} (${gamePct(g,monthBest(monthKey(),g.id,kid))} game points)` : 'No score yet this month'}</div></div>
        ${secs ? `<button class="btn gold small" data-act="play" data-id="${g.id}">Play</button>` : ''}</div>`).join('')}</div>
      <h2>${monthName(monthKey())} game score</h2>
      <p class="soft">Your best score in each game this month counts toward your total. Highest total at the end of the month wins ${PRIZE_PTS} points.</p>
      <div class="race">${Object.keys(KIDS).map(k => `<div class="k-${k}${k===kid?' me':''}"><span>${KIDS[k].name}</span><b>${monthTotal(monthKey(),k)}</b></div>`).join('')}</div>
      <p class="soft" style="margin-top:12px">The clock only runs while you\u2019re playing. If your time runs out in the middle of a game, you get to finish that game.</p>`;
  } else {
    const w = weekStats(kid,0);
    body = `<h2>What happened</h2><p class="soft">This week: ${signed(w.earned)} earned, ${signed(-w.lost)} lost.</p>${historyList(kid,false)}`;
  }
  const held = bal(kid) - avail, notes = []; let pct = null;
  if(held) notes.push(`${held} set aside for a prize you asked for`);
  if(gameSecs(kid)) notes.push(`🎮 ${fmtGame(gameSecs(kid))} of game time`);
  if(goal){
    if(avail >= goal.cost) notes.push(`You have enough for ${goal.emoji} ${goal.label}!`);
    else { notes.push(`Saving for ${goal.emoji} ${goal.label}: ${Math.max(avail,0)} of ${goal.cost}`); pct = Math.max(0, Math.min(100, Math.round(avail/goal.cost*100))); }
  }
  return `<div class="k-${kid}">${banner()}${ticket(kid, {title:KIDS[kid].name+'’s points', notes, pct})}
    ${petitionsFor(kid).map(q => `<div class="ask"><div class="label">${esc(q.emoji)} ${esc(q.label)} <b>${signed(q.pts)}</b></div><div>You asked for points. Waiting for Mom or Dad.</div>
        <div class="acts"><button class="btn ghost small" data-act="unpetition" data-id="${q.id}">Never mind</button></div></div>`).join('')}
    ${pend.map(q => `<div class="ask"><div class="label">${esc(q.emoji)} ${esc(q.label)}</div><div>${q.cash ? `You asked to cash out ${q.cost} points.` : 'You asked for this prize.'} Waiting for Mom or Dad to say yes.</div>
        <div class="acts"><button class="btn ghost small" data-act="cancel" data-id="${q.id}">Never mind</button></div></div>`).join('')}
    ${tabs('ktab', [['prizes','Prizes'],['earn','Earn'],['games','Games'],['history','History']])}${body}
    <div class="foot"><button class="link" data-act="switch">Not ${KIDS[kid].name}?</button></div></div>`;
}

function weekView(kid){
  const w = weekStats(kid,0), l = weekStats(kid,1), g = main.goals && main.goals[kid] && main.rewards && main.rewards[main.goals[kid]];
  return `<h2>${KIDS[kid].name}’s week</h2>
    <div class="stats"><div><b class="plus">${signed(w.earned)}</b><span>earned</span></div><div><b class="minus">${signed(-w.lost)}</b><span>lost</span></div><div><b>${w.spent}</b><span>spent on prizes</span></div></div>
    <p class="soft">Since Sunday. Last week: ${signed(l.earned)} earned, ${signed(-l.lost)} lost, ${l.spent} spent.${g?` Saving for ${esc(g.emoji)} ${esc(g.label)} (${Math.max(available(kid),0)} of ${g.cost}).`:''}</p>
    <div class="list">${w.top.length ? w.top.map(t => `<div class="row"><span class="emo">${esc(t.emoji)}</span><div class="grow"><div class="label">${esc(t.label)}</div><div class="sub">${t.n} ${t.n===1?'time':'times'}</div></div><span class="pts ${cls(t.pts)}">${signed(t.pts)}</span></div>`).join('') : '<div class="empty">No points given or taken away yet this week.</div>'}</div>`;
}

function activities(sel){
  const bs = byPts(sorted(main.behaviors)), up = ui.mode!=='down', one = sel && sel!=='both';
  const arr = bs.filter(b => up ? b.pts>0 : b.pts<0);
  const tile = b => { const sub = actNote(one ? sel : null, b);
    return `<button class="tile" data-act="${sel?'give':'pick'}" data-id="${b.id}"><span class="t-main"><span class="label">${esc(b.label)}</span><span class="pts ${cls(b.pts)}">${signed(b.pts)}</span></span>${sub?`<span class="sub">${esc(sub)}</span>`:''}</button>`; };
  return `<div class="modeseg" role="tablist">
      <button role="tab" class="give" aria-selected="${up}" data-act="tab" data-key="mode" data-id="up">Award</button>
      <button role="tab" class="take" aria-selected="${!up}" data-act="tab" data-key="mode" data-id="down">Deduct</button></div>
    <div class="tiles">${arr.map(tile).join('')}
      <button class="tile custom" data-act="custom" data-id="${up?'1':'-1'}"><span class="t-main"><span class="label">Custom amount</span><span class="pts">…</span></span></button></div>
    ${arr.length ? '' : `<p class="soft">No ways to ${up?'earn':'lose'} points yet. Add them under Set up.</p>`}`;
}

function parentView(){
  if(ui.setup){
    const edit = (kind, arr, val) => `<div class="list">${arr.map(x => { const sub = kind==='behaviors' ? actNote(null,x) : '';
      return `<button class="row" data-act="edit" data-kind="${kind}" data-id="${x.id}"><span class="emo">${esc(x.emoji)}</span><span class="grow"><span class="label">${esc(x.label)}</span>${sub?`<div class="sub">${esc(sub)}</div>`:''}</span><span class="pts ${kind==='behaviors'?cls(x.pts):''}">${val(x)}</span></button>`; }).join('')}
      <button class="row" data-act="add" data-kind="${kind}"><span class="emo">＋</span><span class="grow label">Add ${kind==='behaviors'?'one':'a prize'}</span></button></div>`;
    return `${banner()}<div class="top"><h1>Set up</h1><button class="btn small" data-act="setup" data-id="">Done</button></div>
      <h2>Ways to earn and lose points</h2><p class="soft">Tap one to change it, or to add a streak bonus or game time. Both kids share this list.</p>${edit('behaviors', byPts(sorted(main.behaviors)).sort((a,b)=>(b.pts>0)-(a.pts>0)), x=>signed(x.pts))}
      <h2>Prizes</h2>${edit('rewards', sorted(main.rewards).sort((a,b)=>a.cost-b.cost), x=>x.cost)}
      <h2>Cash out</h2><div class="list"><button class="row" data-act="cashrate"><span class="grow"><span class="label">Cash-out rate</span><div class="sub">Kids can trade points for dollars. Tap to change.</div></span><span class="pts">${cashRate()} pts = $1</span></button></div>
      <h2>This device</h2><div class="list">
        <button class="row" data-act="newpin"><span class="emo">🔑</span><span class="grow label">Change the parent PIN</span></button>
        <button class="row" data-act="switch"><span class="emo">🔁</span><span class="grow"><span class="label">Use this device as someone else</span><div class="sub">Signed in as ${PARENTS[role()].name}</div></span></button></div>`;
  }
  if(ui.games){
    const mk = monthKey(), due = prizeDue(), kids = Object.keys(KIDS), r = monthResult(mk);
    const past = Object.keys(main.prizes || {}).sort().reverse().slice(0,6);
    return `${banner()}<div class="top"><h1>Games</h1><button class="btn small" data-act="games" data-id="">Done</button></div>
      ${due.map(d => `<div class="ask"><div class="label">${monthName(d.mk)} game champion: ${d.tie ? 'tie, ' + d.winners.map(k => KIDS[k].name).join(' and ') : KIDS[d.winners[0]].name}</div>
        <div>${d.totals.map(t => `${KIDS[t.kid].name} ${t.total}`).join(', ')}. ${d.tie ? `Award ${PRIZE_PTS/d.winners.length} points each.` : `Award ${PRIZE_PTS} points.`}</div>
        <div class="acts"><button class="btn" data-act="prize" data-id="${d.mk}">Award prize</button></div></div>`).join('')}
      <h2>Game time</h2>
      <div class="list">${kids.map(k => `<div class="row"><span class="grow label">${KIDS[k].name}</span><span class="pts">${gameSecs(k) ? fmtGame(gameSecs(k)) : 'None'}</span></div>`).join('')}</div>
      <button class="btn wide" style="margin-top:10px" data-act="gtime">Award or deduct game time</button>
      <h2>${monthName(mk)} high scores</h2>
      <p class="soft hint">Each game\u2019s best this month earns game points (pts): its percent of par, up to ${PCT_CAP}. The game points are added. Highest total at month end wins ${PRIZE_PTS} points; a tie splits it.${r ? ` ${r.tie ? 'Tied right now.' : `${KIDS[r.winners[0]].name} leads.`}` : ''}</p>
      ${scoreTable(mk)}
      <h2>Game log</h2><p class="soft hint">Every game the kids play. Only finished games (out of lives) count, and only a kid\u2019s best score in each game each month goes toward the total.</p>
      ${gameLogList()}
      <h2>All-time best</h2><div class="list">${GAMES.map(g => `<div class="row"><span class="grow label">${g.name}</span><span class="sub">${esc(scoreLine(g.id))}</span></div>`).join('')}</div>
      ${past.length ? `<h2>Past champions</h2><div class="list">${past.map(m => { const pr = main.prizes[m]; return `<div class="row"><span class="grow label">${monthName(m)}</span><span class="sub">${pr.winners.map(k => KIDS[k].name).join(' and ')}, +${pr.each}${pr.winners.length>1?' each':''}</span></div>`; }).join('')}</div>` : ''}
      <h2>Test a game</h2><p class="soft hint">Test mode has no timer and doesn\u2019t save scores.</p>
      <div class="list" style="margin-top:8px">${GAMES.map(g => `<div class="row"><span class="grow"><span class="label">${g.name}</span><div class="sub">${g.blurb}</div></span><button class="btn ghost small" data-act="play" data-id="${g.id}">Test</button></div>`).join('')}</div>`;
  }
  const top = `${banner()}<div class="top"><span class="soft">Signed in as ${PARENTS[role()].name}</span><button class="btn ghost small" data-act="setup" data-id="1">Set up</button></div>`;
  if(!ui.kid){   // home: pick a kid; no balances on this screen
    const btn = k => { const n = waitingFor(k); return `<button class="kidbtn k-${k}" data-act="kid" data-id="${k}"><span class="dot"></span><span class="n">${KIDS[k].name}</span>${n?`<span class="cnt" aria-label="${n} waiting">${n}</span>`:''}<span class="chev">›</span></button>`; };
    return `${top}<h1>Points</h1><h2 class="first">Accounts</h2><div class="kidpick">${Object.keys(KIDS).map(btn).join('')}
        <button class="kidbtn k-both" data-act="kid" data-id="both"><span class="dot"></span><span class="n">Both kids</span><span class="chev">›</span></button></div>
      <h2>Quick award</h2><p class="soft hint">Pick an item, then choose who receives it.</p>${activities(null)}
      <h2>Games</h2><div class="kidpick"><button class="kidbtn k-both" data-act="games" data-id="1"><span class="dot"></span><span class="n">Game time, high scores and tests</span>${prizeDue().length ? '<span class="cnt" aria-label="Monthly prize ready">🏆</span>' : ''}<span class="chev">›</span></button></div>`;
  }
  const sel = ui.kid, both = sel==='both', who = both ? 'both kids' : KIDS[sel].name;
  if(both) ui.ptab = 'give';
  let body = '';
  if(ui.ptab==='give') body = activities(sel);
  else if(ui.ptab==='history') body = `<h2>${who}’s history</h2>${historyList(sel,true)}`;
  else body = weekView(sel);
  const back = `<div class="top"><button class="btn ghost small" data-act="kid" data-id="">‹ All kids</button>${both ? `<span class="soft">Signed in as ${PARENTS[role()].name}</span>` : `<button class="btn ghost small" data-act="viewas" data-id="${sel}">View as ${KIDS[sel].name}</button>`}</div>`;
  if(both) return `${banner()}${back}<div class="bothhead"><h1>Both kids</h1><p class="soft">Points you give or take away here go to Emmie and Dawson.</p></div>${body}`;
  return `${banner()}${back}${ticket(sel, {notes:[`Game time: ${gameSecs(sel) ? fmtGame(gameSecs(sel)) : 'none'}`]})}
    ${petitionsFor(sel).map(q => `<div class="ask"><div class="label">${who} asks for ${signed(q.pts)}: ${esc(q.label)}</div><div>Asked ${when(q.ts).toLowerCase()}. Points count only if you approve.</div>
      <div class="acts"><button class="btn ghost" data-act="pdecline" data-id="${q.id}">Decline</button><button class="btn" data-act="papprove" data-id="${q.id}">Approve</button></div></div>`).join('')}
    ${pendingFor(sel).map(q => `<div class="ask"><div class="label">${who} wants: ${esc(q.label)}</div><div>${q.cost} points, asked ${when(q.ts).toLowerCase()}. ${who} has ${bal(sel)}.</div>
      <div class="acts"><button class="btn ghost" data-act="decline" data-id="${q.id}">Decline</button><button class="btn" data-act="approve" data-id="${q.id}">Approve</button></div></div>`).join('')}
    ${tabs('ptab', [['give','Points'],['history','History'],['week','This week']])}<div>${body}</div>`;
}

function render(){
  if(!loaded) return;
  const r = role(); let html;
  const viewing = ui.viewAs && isParent(r) && parentOK() ? ui.viewAs : null;
  if(KIDS[r]) html = kidView(r);
  else if(viewing) html = `<div class="viewbar" role="status"><span>Viewing as ${KIDS[viewing].name}. Taps here don\u2019t change anything.</span><button class="btn small" data-act="viewas" data-id="">Exit</button></div>` + kidView(viewing);
  else if(isParent(r) && parentOK()) html = parentView();
  else html = pickerView();
  const adult = isParent(r) && parentOK() && !viewing;
  document.body.classList.toggle('adult', adult);
  document.querySelector('meta[name=theme-color]').content = adult ? '#F3F4F7' : '#EEEAFB';
  $('#app').innerHTML = html + `<div class="foot ver"><span class="soft">Version ${VERSION}</span><button class="link" data-act="update">Check for update</button></div>`;
  for(const k in KIDS) lastBal[k] = bal(k);
  const waiting = isParent(r) && main ? Object.keys(main.requests||{}).length + Object.keys(main.petitions||{}).length : 0;
  document.title = (waiting ? `(${waiting}) ` : '') + 'Eisenberg Points';
}

/* ---------- events ---------- */
function becomeParent(id){
  const finish = async h => {
    if(!main || !main.pinHash){
      const seed = {pinHash:h, balances:{emmie:0,dawson:0}, behaviors:{}, rewards:{}, requests:{}};
      DEFAULTS.behaviors.forEach(([emoji,label,pts],i) => seed.behaviors['b'+i] = {emoji,label,pts,ord:i});
      DEFAULTS.rewards.forEach(([emoji,label,cost],i) => seed.rewards['r'+i] = {emoji,label,cost,ord:i});
      await store.seed(seed); main = main || seed;
    }
    ls.set('ep_pin', h); ls.set('ep_role', id); render();
  };
  if(main && main.pinHash && ls.get('ep_pin')===main.pinHash) return finish(main.pinHash);
  pinSheet(main && main.pinHash ? 'enter' : 'create', finish);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.closest('#sheet')) return;
  const {act,id,kind,key} = b.dataset, r = role();
  if(act==='update') checkUpdate();
  else if(act==='role'){ if(KIDS[id]){ ls.set('ep_role', id); render(); checkNews(id); } else becomeParent(id); }
  else if(act==='tab'){ ui[key] = id; render(); }
  else if(act==='kid'){ ui.kid = id || null; if(!id) ui.ptab = 'give'; $('#toast').className = ''; render(); window.scrollTo(0,0); }
  else if(act==='setup'){ ui.setup = !!id && isParent(r); render(); window.scrollTo(0,0); }
  else if(act==='games'){ ui.games = !!id && isParent(r); render(); window.scrollTo(0,0); }
  else if(act==='viewas'){ ui.viewAs = id && isParent(r) ? id : null; ui.ktab = 'prizes'; $('#toast').className = ''; render(); window.scrollTo(0,0); }
  else if(ui.viewAs && isParent(r)){   // previewing a kid's screen: tabs and games work, nothing gets saved
    if(act==='switch'){ ui.viewAs = null; render(); window.scrollTo(0,0); }
    else if(act==='play') playGame(id, true);
    else if(['request','cancel','unpetition','petition','goal','cash'].includes(act)) toast(`Preview only. Nothing was sent or saved for ${KIDS[ui.viewAs].name}.`);
  }
  else if(act==='switch'){
    const out = () => { ls.set('ep_role', null); ui.setup = false; ui.games = false; $('#toast').className = ''; render(); };
    if(isParent(r) || !(main && main.pinHash)) out(); else pinSheet('enter', out);
  }
  else if(KIDS[r]){
    if(act==='request') requestPrize(r, id);
    else if(act==='cash') cashSheet(r);
    else if(act==='cancel') cancelRequest(id);
    else if(act==='play'){ if(gameSecs(r)>0) playGame(id, false); }
    else if(act==='unpetition') cancelPetition(id);
    else if(act==='petition'){
      const x = id && main.behaviors && main.behaviors[id];
      if(x) askPoints(r, {label:x.label, emoji:x.emoji, pts:x.pts, bid:id}); else petitionSheet(r);
    }
    else if(act==='goal') run(store.apply({set:{['goals.'+r]: main.goals && main.goals[r]===id ? DEL : id}}));
  }
  else if(isParent(r) && parentOK()){
    if(act==='give'){ const x = main.behaviors[id]; if(x) give(ui.kid, x.pts, x.label, x.emoji, {id, ...x}); }
    else if(act==='custom') customSheet(ui.kid, id);
    else if(act==='pick') pickSheet(id);
    else if(act==='play') playGame(id, true);
    else if(act==='gtime') gameTimeSheet();
    else if(act==='prize') awardPrize(id);
    else if(act==='remove'){ removeEntry(b.dataset.kid, id, +b.dataset.pts, +b.dataset.gsec || 0); toast('Removed'); }
    else if(act==='approve') answer(id, true);
    else if(act==='papprove') answerPetition(id, true);
    else if(act==='pdecline') answerPetition(id, false);
    else if(act==='decline') answer(id, false);
    else if(act==='edit') itemSheet(kind, id);
    else if(act==='add') itemSheet(kind);
    else if(act==='cashrate') cashRateSheet();
    else if(act==='newpin') pinSheet('create', async h => { await store.apply({set:{pinHash:h}}); ls.set('ep_pin', h); toast('PIN changed. Mom and Dad both need the new one.'); });
  }
});

/* ---------- no accidental zoom: block pinch zoom (iPhone/iPad ignore the viewport setting for pinch); double-tap zoom is off via touch-action ---------- */
['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));

/* ---------- start ---------- */
(async function start(){
  try{ store = FIREBASE_CONFIG ? await firebaseStore(FIREBASE_CONFIG) : localStore(); }
  catch(e){ loaded = true; loadError = 'Couldn’t reach the sync service. Check the internet connection and reload.'; store = localStore(); }
  const fail = e => { loaded = true; loadError = 'Sync isn’t working: ' + (e && e.code==='permission-denied' ? 'the database rules are blocking this app.' : 'check the internet connection.'); render(); };
  let knownAsks = null, cashMigrated = false;
  store.subMain(d => {
    main = d; loaded = true; loadError = ''; render();
    if(d && isParent(role()) && parentOK() && !(d.migr && d.migr.cash1) && !cashMigrated){
      cashMigrated = true;
      const set = {'migr.cash1': true}, gone = [];
      for(const [id,r] of Object.entries(d.rewards || {})) if(/^\$\s?\d+(\.\d+)?(\s+amazon(\s+purchase)?)?$/i.test((r.label||'').trim())){ set['rewards.'+id] = DEL; gone.push(id); }
      for(const [k,gid] of Object.entries(d.goals || {})) if(gone.includes(gid)) set['goals.'+k] = DEL;
      run(store.apply({set}));
    }
    const asks = Object.assign({}, d && d.requests, d && d.petitions);
    if(knownAsks && isParent(role()) && parentOK()) for(const id in asks) if(!knownAsks.has(id)){
      const q = asks[id]; toast(q.cost!=null ? `${KIDS[q.kid].name} asked for ${q.label}` : `${KIDS[q.kid].name} asked for ${signed(q.pts)}: ${q.label}`);
    }
    knownAsks = new Set(Object.keys(asks));
  }, fail);
  for(const k in KIDS) store.subLog(k, rows => { logs[k] = rows; logsLoaded[k] = true; render(); checkNews(k); }, fail);
  for(const k in KIDS) store.subGames(k, rows => { gamesLog[k] = rows; if(ui.games) render(); });
})();
</script>
</body>
</html>
